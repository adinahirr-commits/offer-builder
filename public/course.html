<style>

  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Heebo',sans-serif;background:var(--canvas);color:var(--ink);line-height:1.6}
  .top{background:var(--ink);color:var(--canvas);padding:20px 22px 16px;text-align:center;position:sticky;top:0;z-index:20}
  .top h1{font-size:1.3rem;font-weight:800}.top p{font-size:.9rem;opacity:.8;margin-top:4px}

  .modes a.on{background:var(--pink);border-color:var(--pink);color:var(--ink)}
  .board{max-width:640px;margin:0 auto;padding:18px 16px 150px}
  .note{background:var(--pink-soft);border-radius:14px;padding:14px 18px;font-size:.92rem;margin-bottom:16px}
  .grp{background:#fff;border:1px solid var(--line);border-radius:20px;margin-bottom:14px;overflow:hidden}
  .grp>summary{list-style:none;cursor:pointer;padding:18px 22px;font-weight:800;font-size:1.08rem;display:flex;align-items:center}
  .grp>summary::-webkit-details-marker{display:none}
  .grp>summary::after{content:"▾";color:var(--pink);margin-inline-start:auto}
  .grp[open]>summary::after{content:"▴"}
  .grp .body{padding:0 22px 20px}
  .movecap{font-size:.82rem;color:var(--soft);margin:-4px 0 14px;line-height:1.55}
  .fld{margin-bottom:14px}.fld label{display:block;font-weight:700;font-size:.96rem;margin-bottom:4px}
  .fld .hint{font-size:.8rem;color:var(--soft);margin-bottom:7px}
  .fld input,.fld textarea,.fld select{width:100%;font-family:inherit;font-size:1rem;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
  .fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--pink)}
  .fld textarea{min-height:96px;resize:vertical;line-height:1.6}
  .fld textarea.tall{min-height:200px}
  .ai{background:var(--sky);border-radius:14px;padding:14px;margin-bottom:14px}

  .cbtn.alt{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}

  .steps{display:grid;gap:8px;margin:2px 0 14px}
  .step{display:flex;gap:10px;font-size:.85rem;color:var(--ink);line-height:1.5}
  .step b{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.78rem}
  .palgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
  .palbtn{display:flex;align-items:center;gap:8px;font-family:inherit;font-weight:700;font-size:.85rem;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}

const board = document.getElementById("board");
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");

function fieldHTML(f){
  if(f.t==="palettePicker"){
    return '<div class="fld"><label>ערכת הצבעים</label><input type="hidden" data-k="palette" value="">'+
      '<div class="palgrid">'+Object.keys(PageEngine.PALETTES).map(k=>{
        const p=PageEngine.PALETTES[k];
        return '<button type="button" class="palbtn" data-pal="'+k+'"><span class="dots"><i style="background:'+p.accent+'"></i><i style="background:'+p.ident+'"></i><i style="background:'+p.ink+'"></i></span><span>'+p.name+'</span></button>';
      }).join("")+'</div></div>';
  }
  if(f.t==="imgPicker"){
    return '<div class="fld"><label>'+f.label+'</label>'+(f.hint?'<div class="hint">'+f.hint+'</div>':'')+
      '<input type="hidden" data-k="'+f.k+'" value="">'+
      '<div class="imgrow" data-imgrow="'+f.k+'">'+
      '<label class="imgbtn">📷 בחרי תמונה<input type="file" accept="image/*,.heic,.heif" data-imgfile="'+f.k+'" style="display:none"></label>'+
      '<img class="imgprev" data-imgprev="'+f.k+'" style="display:none" alt="">'+
      '<button type="button" class="imgdel" data-imgdel="'+f.k+'" style="display:none">הסרה ✕</button></div></div>';
  }
  if(f.t==="hidden") return '<input type="hidden" data-k="'+f.k+'" value="">';
  let el;
  if(f.t==="choice") el='<select data-k="'+f.k+'">'+f.options.map(o=>'<option value="'+o.v+'"'+(o.v===f.v?' selected':'')+'>'+o.label+'</option>').join("")+'</select>';
  else if(f.t==="area") el='<textarea data-k="'+f.k+'">'+esc(f.v||"")+'</textarea>';
  else el='<input data-k="'+f.k+'" value="'+esc(f.v||"")+'">';
  return '<div class="fld"><label>'+f.label+'</label>'+(f.hint?'<div class="hint">'+f.hint+'</div>':'')+el+'</div>';
}

  d.innerHTML='<summary>'+title+'</summary><div class="body">'+(capHTML?'<div class="movecap">'+capHTML+'</div>':'')+bodyHTML+'</div>';
  board.appendChild(d); return d;
}

/* ── העתקת פרומפט ── */
async function copyText(txt){
  try{ await navigator.clipboard.writeText(txt); return true; }catch(e){}
  const ta=document.createElement("textarea"); ta.value=txt; ta.style.cssText="position:fixed;top:0;opacity:0";
  document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
  ta.remove(); return ok;
}
function sectionsText(a){ const o={}; CoursePrompts.ORDER.forEach(k=>{ if(k!=="hero") o[k]=a[CoursePrompts.FIELD[k]]||""; }); return o; }
async function doCopy(btn, what){
  const a = readAll();
  if(what!=="offer" && !(a.audience||a.problem||a.result||a.offerDoc)){
    toast("קודם ממלאים למעלה ״מה את מוכרת״, אחרת ה-AI ינחש"); return;
  }
  let p;
  if(what==="offer") p = CoursePrompts.offerPrompt(a);
  else if(what==="base") p = CoursePrompts.basePrompt(a);
  else p = CoursePrompts.refinePrompt(what.split(":")[1], a, sectionsText(a));
  const ok = await copyText(p);
  if(ok){ const o=btn.textContent; btn.textContent="✓ הועתק"; btn.classList.add("ok"); setTimeout(()=>{btn.textContent=o;btn.classList.remove("ok");},2500);
    toast("הפרומפט הועתק. עכשיו מדביקים ב-ChatGPT / Claude / ג'מיני"); }
  else toast("ההעתקה נחסמה בדפדפן. נסי דפדפן אחר");
}

/* ── פיזור הדף הראשון למקטעים ── */
function spreadBase(){
  const txt=document.querySelector('[data-k="baseDoc"]').value;
  if(!txt.trim()){ toast("קודם מדביקים את הדף שה-AI כתב"); return; }
  const parts = CoursePrompts.splitBase(txt);
  const keys = Object.keys(parts);
  if(!keys.length){ toast("לא מצאתי כותרות ״מקטע 1, מקטע 2...״ בטקסט. בקשי מה-AI לסמן כל מקטע, או הדביקי ידנית בכל מקטע"); return; }
  const filled = keys.filter(k=>{ const el=document.querySelector('[data-k="'+k+'"]'); return el && el.value.trim(); });
  if(filled.length && !confirm("יש כבר טקסט ב-"+filled.length+" מקטעים. להחליף אותם?")) return;
  keys.forEach(k=>{ const el=document.querySelector('[data-k="'+k+'"]'); if(el) el.value=parts[k]; });
  saveLocal(); toast("מילאתי "+keys.length+" שדות. עברי על כל מקטע ושפרי");
}

function clientLog(stage,msg,file){
  try{ fetch("/api/log",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:TOKEN,stage,msg:String(msg||""),file:file?(file.name+" "+file.type+" "+Math.round(file.size/1024)+"KB"):"",ua:navigator.userAgent})}); }catch(e){}
}
function shrink(file){
  return new Promise((res,rej)=>{
    const img=new Image(); const u=URL.createObjectURL(file);
    img.onload=()=>{ try{
        const MAX=1400, r=Math.min(1, MAX/Math.max(img.width,img.height));
        const c=document.createElement("canvas"); c.width=Math.round(img.width*r); c.height=Math.round(img.height*r);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        const out=c.toDataURL("image/jpeg",.82); if(out.length<1000) throw new Error("canvas empty"); res(out);
      }catch(e){ rej(e); } finally{ URL.revokeObjectURL(u); } };
    img.onerror=()=>{ URL.revokeObjectURL(u); rej(new Error("browser cannot decode")); };
    img.src=u;
  });
}
function readRaw(file){
  return new Promise((res,rej)=>{
    if(file.size>16*1024*1024) return rej(new Error("התמונה גדולה מדי (עד 16MB)"));
    const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=()=>rej(new Error("לא הצלחתי לקרוא את הקובץ")); fr.readAsDataURL(file);
  });
}
async function uploadImg(k, file){
  const row=document.querySelector('[data-imgrow="'+k+'"] .imgbtn');
  const orig=row.childNodes[0].textContent; row.childNodes[0].textContent="מעלה... ";
  clientLog("start","",file);
  try{
    let dataUrl, raw=false;
    try{ dataUrl=await shrink(file); }catch(e){ clientLog("shrink-failed",e.message,file); dataUrl=await readRaw(file); raw=true; }
    const r=await fetch("/api/upload",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({dataUrl,raw,token:TOKEN})});
    let j={}; try{ j=await r.json(); }catch(e){ j={error:"השרת לא ענה כמו שצריך ("+r.status+"). נסי שוב בעוד רגע"}; }
    if(!j.ok) throw new Error(j.error||"שגיאה");
    document.querySelector('[data-k="'+k+'"]').value=j.url; saveLocal(); refreshImg(k); clientLog("done",j.url,file);
  }catch(e){ clientLog("failed",e.message,file); alert("ההעלאה לא הצליחה: "+e.message); }
  row.childNodes[0].textContent=orig;
}

document.addEventListener("input",e=>{ if(e.target.dataset.k) saveLocal(); });
document.addEventListener("change",e=>{
  if(e.target.dataset.imgfile && e.target.files[0]){ uploadImg(e.target.dataset.imgfile, e.target.files[0]); e.target.value=""; return; }
  if(e.target.dataset.k) saveLocal();
});
document.addEventListener("click",e=>{
  const t=e.target;
  const palBtn=t.closest&&t.closest(".palbtn");
  if(palBtn){ document.querySelector('[data-k="palette"]').value=palBtn.dataset.pal; saveLocal(); refreshPal(); return; }
  if(t.dataset&&t.dataset.imgdel){ document.querySelector('[data-k="'+t.dataset.imgdel+'"]').value=""; saveLocal(); refreshImg(t.dataset.imgdel); return; }
  if(t.dataset&&t.dataset.copy){ doCopy(t, t.dataset.copy); }
});

/* מחפשים שאריות [להשלים] מה-AI, כדי שלא יעלו לאוויר */
function leftovers(d){
  const hits=[];
  Object.keys(d).forEach(k=>{ if(typeof d[k]==="string" && /\[(להשלים|הכנס|הכניסי|שם)[^\]]*\]/.test(d[k])) hits.push(k); });
  return hits;
}

async function publish(){
  const d = readAll();
  if(!d.bizName){ alert("רק צריך שם עסק או תוכנית 🙂"); return; }
  if(!d.email || d.email.indexOf("@")<0){ alert("צריך את המייל שלך כדי לפתוח לך את טבלת הלידים 🙂"); return; }
  if(!(d.legalContact||"").trim()){ alert("צריך טלפון או מייל ליצירת קשר (לפי החוק, מופיע בהצהרת הנגישות ובמדיניות הפרטיות) 🙂"); return; }
  if(!d.headline){ alert("חסרה כותרת. מלאי את מקטע הכותרת 🙂"); return; }
  if((d.ctaMode==="pay"||d.ctaMode==="call") && !/^https:\/\//i.test((d.ctaUrl||"").trim())){
    alert("בחרת שהכפתור יוביל לקישור, אבל הקישור חסר או לא מתחיל ב-https://"); return; }
  const left = leftovers(d);
  if(left.length && !confirm("נשארו בדף סימנים כמו [להשלים...] שה-AI השאיר. כדאי להשלים אותם לפני שמפרסמים.\nלפרסם בכל זאת?")) return;
  const btn = event.target; btn.textContent="מפרסמת..."; btn.disabled=true;
  try{
    const r = await fetch("/api/publish",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(EditSync.withKey(d))});
    const j = await r.json();
    if(!j.ok) throw new Error(j.error||"שגיאה");
    EditSync.remember(j);
    const ownMsg = d.ownership==="own" ? 'שלחתי לך למייל בקשה להפוך לבעלת הטבלה — אשרי אותה והטבלה תהיה שלך לגמרי.' : 'הטבלה משותפת אלייך במייל.';
    document.body.innerHTML =
      '<div class="done"><h2>הדף שלך באוויר! 🎉</h2><p style="color:#6B6B7B">שני הקישורים שלך:</p>'+
      '<a class="pink" href="'+j.pageUrl+'" target="_blank">🌐 דף הקורס שלך (לשתף בסטורי)</a>'+
      '<a href="'+j.sheetUrl+'" target="_blank">📊 טבלת הלידים שלך בגוגל</a>'+
      EditSync.doneHTML(j)+
      (j.live? '<p style="color:#6B6B7B;font-size:.85rem;margin-top:10px">'+ownMsg+'</p>'
             : '<p style="color:#EF55A5;font-size:.85rem;margin-top:10px">מצב בדיקה — עדיין לא מחובר לגוגל.</p>')+'</div>';
  }catch(e){
    alert("משהו השתבש: "+e.message); btn.textContent="🚀 פרסמי את הדף"; btn.disabled=false;
  }
}
